name: Upload JavaScript Sourcemaps to Datadog
description: Upload JavaScript Sourcemaps to Datadog
branding:
  icon: hard-drive
  color: blue
inputs:
  api-key:
    description: DataDog API Key
    required: true
  dd-site:
    description: DataDog Site
    default: datadoghq.com
    required: true
  path:
    description: Path of JavaScript Sourcemaps files
    default: ./dist/
    required: true
  service:
    description: Service Name
    default: frontend
    required: true      
  release-version:
    description: Release Version (Usually Github Head Commit SHA)
    default: ${{ github.sha }}
    required: true
  minified-path-prefix:
    description: Minified Path Prefix
    default: https://cdn.mycompany.com
    required: true   
  disable-git:
    description: Prevents the command from invoking git in the current working directory and sending repository related data to Datadog
    default: false
    required: true
  repository-url:
    description: Overrides the repository remote with a custom URL
    default: ''
    required: false
  project-path:
    description: The path of the project where the sourcemaps were built
    default: ''
    required: false
  
runs:
  using: "composite"
  steps:
    - name: Set Node.js
      uses: actions/setup-node@v3

    - name: Install DataDog CI
      shell: bash
      run: npm install -g @datadog/datadog-ci

    - name: Upload Sourcemaps
      shell: bash
      env:
        DATADOG_SITE: ${{ inputs.dd-site }}
        DATADOG_API_KEY: ${{ inputs.api-key }}
      run: |
        datadog-ci sourcemaps upload ${{ inputs.path }} \
        --service=${{ inputs.service }} \
        --release-version=${{ inputs.release-version }} \
        --minified-path-prefix=${{ inputs.minified-path-prefix }} \
        --disable-git=${{ inputs.disable-git }} \
        --repository-url=${{ inputs.repository-url }} \
        --project-path=${{ inputs.project-path }}
        